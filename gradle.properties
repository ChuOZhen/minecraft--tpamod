# ---------------------------------------------------------------------------
# TPA Mod — 玩家传送请求模组（Minecraft 26.3 / Fabric）
#
# 【来源声明】本项目初版由旧模型 v3.2 生成（面向 Minecraft 1.21.1 / Yarn），
#            未经构建验证；后依据《经验.md》升级至 Minecraft 26.3。
#            完整说明见 README。
# ---------------------------------------------------------------------------

# ==== 项目标识 ====
mod_version=2.0.0
maven_group=com.example
archives_base_name=tpa

# ==== 工具链版本号（26.3 实测结论）====

# Minecraft
minecraft_version=26.3

# Loader
loader_version=0.19.5

# Fabric API（本环境以 libs/fabric-api-modules/ 本地模块 jar 提供）
fabric_version=0.161.0+26.3

# 占位值：26.3 尚无官方 Yarn 映射，实际构建使用 gradle/identity-mappings.jar
# 查询方式：https://meta.fabricmc.net/v2/versions/yarn/26.3
yarn_mappings=26.3+build.1

# Gradle：Loom 1.18.2 要求 >= 9.7.0
gradle_wrapper_version=9.7.1
